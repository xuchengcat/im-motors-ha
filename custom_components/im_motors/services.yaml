vehicle_control:
  name: 车辆控制（全功能模式）
  description: 发送一次真实车控指令；仅全功能且接受风险后可用。返回 accepted 只代表服务器受理，须自行确认车辆实际状态。超时不自动重发。
  fields:
    entry_id:
      required: true
      selector:
        config_entry:
          integration: im_motors
    vehicle_id:
      description: 车辆哈希 ID，见车控状态实体或 list_controls。仅关联一辆车时可省略。
      selector:
        text:
    action:
      required: true
      example: open_trunk
      selector:
        select:
          options:
            - lock
            - unlock
            - open_trunk
            - close_trunk
            - unlock_trunk
            - open_windows
            - close_windows
            - vent_windows
            - find_car
            - stop_find_car
            - open_bonnet
            - close_bonnet
            - open_charge_port
            - start_charge
            - stop_charge
            - battery_warm_on
            - battery_warm_off
            - ac_on
            - ac_off
            - ac_temperature
            - seat_heat
            - seat_vent
            - steering_heat
            - charge_target
            - charge_current
            - schedule_charge
            - cancel_schedule_charge
            - sentry_on
            - sentry_off
    parameters:
      description: 按动作填写参数；无参数的动作留空。完整字段与范围见 docs/vehicle-control.md。
      example: '{"percent": 80}'
      selector:
        object:
list_controls:
  name: 列出车控能力
  description: 返回关联车辆哈希 ID、当前模式和静态协议候选动作；不发送任何云端请求，不代表车型支持或实车验证通过。
  fields:
    entry_id:
      required: true
      selector:
        config_entry:
          integration: im_motors

import_trip_history:
  name: 导入历史行程
  description: 将手机整理后的 JSON/CSV 合并到本地历史库。不会登录智己车主账号。
  fields:
    entry_id:
      required: true
      selector:
        config_entry:
          integration: im_motors
    vehicle_id:
      required: true
      description: 行程查询页面 WebSocket 返回的车辆哈希 ID。
      selector:
        text:
    format:
      default: json
      selector:
        select:
          options:
            - json
            - csv
    content:
      required: true
      selector:
        text:
          multiline: true
query_trip_history:
  name: 查询历史行程
  description: 按日期查询本地档案，不请求智己或高德。
  fields:
    entry_id:
      required: true
      selector:
        config_entry:
          integration: im_motors
    vehicle_id:
      required: true
      selector:
        text:
    start_date:
      required: true
      selector:
        date:
    end_date:
      required: true
      selector:
        date:
sync_trip_history:
  name: 同步行程或补全地址
  description: 授权账号立即读取车况并记录；主账号同步所选日期的官方历史行程，每次最多31天。也可仅补全已入库行程地址。
  fields:
    entry_id:
      required: true
      selector:
        config_entry:
          integration: im_motors
    geocode_only:
      default: false
      selector:
        boolean:
    start_date:
      description: 主账号同步开始日期（YYYY-MM-DD），默认今天；授权账号不使用。
      selector:
        date:
    end_date:
      description: 主账号同步结束日期（YYYY-MM-DD），默认今天。
      selector:
        date:

query_energy_history:
  name: 查询充电与加油记录
  description: 只读取本地档案，单次最多366天。纯电车辆只返回充电记录。
  fields:
    entry_id:
      required: true
      selector:
        config_entry:
          integration: im_motors
    vehicle_id:
      required: true
      selector:
        text:
    start_date:
      required: true
      selector:
        date:
    end_date:
      required: true
      selector:
        date:
    kind:
      selector:
        select:
          options: [charge, refuel]
    include_hidden:
      selector:
        boolean:
    offset:
      selector:
        number:
          min: 0
          max: 100000
          mode: box
    limit:
      selector:
        number:
          min: 1
          max: 500
          mode: box

save_energy_record:
  name: 添加或补充充电与加油记录
  description: 自动证据与手工补填分别保存。编辑已有记录需提供最新revision，纯电车辆不能添加加油记录。
  fields:
    entry_id:
      required: true
      selector:
        config_entry:
          integration: im_motors
    vehicle_id:
      required: true
      selector:
        text:
    kind:
      required: true
      selector:
        select:
          options: [charge, refuel]
    values:
      required: true
      description: 包含date，充电可填energy_kwh、soc_start、soc_end；加油可填litres、fuel_before、fuel_after、confirmed；共同支持带时区的start_time/end_time、amount、address、note。
      selector:
        object:
    record_id:
      selector:
        text:
    revision:
      selector:
        number:
          min: 1
          max: 1000000
          mode: box
